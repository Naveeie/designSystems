spring:
  config:
    activate:
      on-profile: kafka
  cloud:
    function:
      definition: conversationEvents;deploymentRequest;agentUpdate;tenantOperation
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_SERVERS:localhost:9092}
          replicationFactor: 1
          auto-create-topics: true
      bindings:
        summaryUpdate-out-0:
          destination: ${SUMMARY_UPDATE_TOPIC:summary-update}
        metricReportEvents-out-0:
          destination: ${METRICS_REPORTER_TOPIC:metrics-reporter}
        summaryReviewed-out-0:
          destination: ${SUMMARY_REVIEWED_TOPIC:summary-reviewed}
        conversationEvents-in-0:
          destination: ${CONVERSATION_EVENTS_TOPIC:conversation-events}
          group: ${CONSUMER_GROUP:summary-group}
        conversationEvents-out-0:
          destination: ${CONVERSATION_EVENTS_TOPIC:conversation-events}
        deploymentRequest-in-0:
          destination: ${TOPIC_DEPLOYMENT_EVENTS:environments.deployment-events}
          group: ${CONSUMER_GROUP:summary-deployment}
        deploymentRequest-out-0:
          destination: ${TOPIC_DEPLOYMENT_EVENTS:environments.deployment-events}
        deploymentResponse-out-0:
          destination: ${TOPIC_DEPLOYMENT_STATUS:environments.deployment-status}
        agentUpdate-out-0:
          destination: ${TOPIC_SUMMARY_AGENT_UPDATE:summary-agent-updates}
        agentUpdate-in-0:
          destination: ${TOPIC_SUMMARY_AGENT_UPDATE:summary-agent-updates}
          group: ${CONSUMER_GROUP:uassist-summary}
        tenantOperation-in-0:
          destination: ${TOPIC_TENANT_OPERATION:tenant-operation}
          group: ${CONSUMER_GROUP:uassist-summary}
