kind: Project
name: uassist-summary
sources:
  - name: platform-thirdparty
    repositoryUrl: ${var.remoteModulePrefixGithub}github.com/uniphore/platform-thirdparty-modules.git#main
modules:
  include:
    # thirdparty servicess
    - garden/platform-secrets
    - garden/postgresql
    - garden/postgresql-init
    - garden/zookeeper
    - garden/kafka
    - garden/kafka-provisioning
    - garden/mongodb
    - garden/redis
    - garden/efs-mount
   # uassist-summary service
    - charts/uassist-summary
    - uassist-summary.garden.yml

  exclude:
    - garden/kafdrop

variables:
  host: ""
  remoteModulePrefixGithub: ${local.env.GITHUB_PULL_TOKEN && "https://platform:" + local.env.GITHUB_PULL_TOKEN + "@" || "ssh://git@"}
  remoteModulePrefixCloud: ${local.env.REMOTE_MODULE_PREFIX_CLOUD || "ssh://git"}
  remoteModulePrefixPE: ${local.env.REMOTE_MODULE_PREFIX_PE || "ssh://git"}
  urlScheme: https
  useKafkaFromSecrets: false
  kafka:
    consumerConcurrency: 1
  datadog:
    env: ""
  nfs:
    server: fs-005257867924eddf5.efs.us-east-2.amazonaws.com
  java:
    opts: -Xms1024m -Xmx4096m # -Xms128m -Xmx1024m
  log:
    apiLevel: WARN
    rootLevel: WARN
  standardSolutionPacks:
    application: "uassist"
    name: ""
    version: ""
  ccr:
    targetImage: dev
    imagePullSecrets: uniphore-secret
  useElasticCacheFromSecrets: false

environments:
  - name: local
    defaultNamespace: default
    variables:
      urlScheme: http
      kubernetesProvider: local-kubernetes
      datadog:
        env: "local"
        tls:
          enabled: false

  - name: dev
    defaultNamespace: ${replace(local.usernameLowerCase,'.','-')}
    variables:
      kubernetesProvider: kubernetes
      datadog:
        env: "dev-${replace(local.usernameLowerCase,'.','-')}"

  - name: build
    defaultNamespace: build
    variables:
      kubernetesProvider: kubernetes
      ccr:
        targetImage: app
      datadog:
        env: build

  - name: ci
    defaultNamespace: ${project.name}-${local.env.CI_PIPELINE_ID || local.env.GITHUB_RUN_ID}
    variables:
      kubernetesProvider: kubernetes
      datadog:
        env: "ci"

providers:
  - name: jib
  - name: local-kubernetes
    environments:
      - local
    setupIngressController: kong
    defaultHostname: api.localhost
    namespace: ${environment.namespace}

  - name: kubernetes
    environments:
      - dev
    context: arn:aws:eks:us-east-2:346163573116:cluster/uniphore-dev-us-eks-platform
    defaultHostname: us.cloud.uniphoredev.com
    namespace:
      name: ${environment.namespace}
      annotations:
        updateTimestamp: ${slice(datetime.now,0,19)}Z
        lastModifiedBy: ${replace(local.usernameLowerCase,'.','-')}
    buildMode: cluster-buildkit
    imagePullSecrets:
      - name: uniphore-secret
        namespace: default
      - name: dockerhub-secret
        namespace: default
    deploymentRegistry:
      hostname: registry.uniphore.com
      namespace: uniphore-manual

  - name: kubernetes
    environments:
      - build
    context: arn:aws:eks:us-east-2:346163573116:cluster/uniphore-dev-us-eks-platform
    defaultHostname: us.cloud.uniphoredev.com
    namespace:
      name: staging
    buildMode: cluster-buildkit
    imagePullSecrets:
      - name: uniphore-secret
        namespace: default
    deploymentRegistry:
      hostname: registry.uniphore.com
      namespace: uniphore

  - name: kubernetes
    environments:
      - ci
    context: arn:aws:eks:us-east-2:346163573116:cluster/uniphore-dev-us-eks-platform
    defaultHostname: us.cloud.uniphoredev.com
    namespace:
      name: ${environment.namespace}
      annotations:
        updateTimestamp: ${slice(datetime.now,0,19)}Z
        lastModifiedBy: ${replace(local.usernameLowerCase,'.','-')}
    buildMode: cluster-buildkit
    imagePullSecrets:
      - name: uniphore-secret
        namespace: default
      - name: dockerhub-secret
        namespace: default
    deploymentRegistry:
      hostname: registry.uniphore.com
      namespace: uniphore

  - name: octant
    environments: [local, dev]
